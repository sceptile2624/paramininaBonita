<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliz Día del Niño, mi niña hermosa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Lienzo para confeti y corazones -->
  <canvas id="magic-canvas"></canvas>

  <div id="content">
    <header>
      <h1 class="rainbow-text">¡Feliz Día del Niño, mi niña hermosa!</h1>
      <p class="subheader">Desde el <strong>13 de enero de 2024</strong> eres mi niña más linda y te amo con todo mi corazón.</p>
    </header>

    <section class="collage parallax">
      <img src="images/photo1.jpg" alt="Nosotros 1">
      <img src="images/photo2.jpg" alt="Nosotros 2">
      <img src="images/photo3.jpg" alt="Nosotros 3">
      <img src="images/photo4.jpg" alt="Nosotros 4">
    </section>

    <section class="game">
      <h2>Un jueguito de amor 💕</h2>
      <button id="showPhrase">Dame una frase dulce</button>
      <div id="phraseBox">¡Haz clic y sorpréndete!</div>
    </section>

    <footer>
      <p>Te amo muchísimo, mi niña hermosa. Siempre juntos y siempre con amor 💖</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
